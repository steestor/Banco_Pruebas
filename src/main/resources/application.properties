spring.application.name=banco-pruebas-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/banco_pruebas
spring.datasource.username=banco
spring.datasource.password=banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# El esquema y los datos los carga el propio arranque: el banco de pruebas debe partir
# siempre del mismo estado conocido, si no las aserciones de las features no son estables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true
